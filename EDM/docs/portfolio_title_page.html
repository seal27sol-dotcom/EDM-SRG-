<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic Cover Page</title>
    <style>
        @page {
            size: A4;
            margin: 18mm;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #1a2a2d;
        }

        .page {
            width: 100%;
            min-height: 297mm;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 720px;
            border: 2px solid #dfe8e2;
            border-radius: 12px;
            padding: 32px 28px;
            background: linear-gradient(180deg, #ffffff 0%, #f7faf8 100%);
            box-shadow: 0 5px 18px rgba(20, 58, 51, 0.06);
        }

        .small {
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #4a635c;
            margin-bottom: 22px;
        }

        h1 {
            margin: 0 0 24px 0;
            font-size: 30px;
            line-height: 1.2;
            color: #143b33;
        }

        .info {
            margin-top: 28px;
            font-size: 16px;
            line-height: 1.9;
        }

        .line {
            border-bottom: 1px solid #dfe8e2;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .footer {
            margin-top: 42px;
            font-size: 12px;
            color: #5e6e68;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="card">
            <div class="small">Enterprise Data Management</div>
            <h1>Project Savanna<br />Portfolio</h1>

            <div class="info">
                <div class="line"><strong>Student Name:</strong> Musamali Christopher</div>
                <div class="line"><strong>Email:</strong> christophermusamali27@gmail.com</div>
                <div class="line"><strong>Student ID:</strong> 2025-05-43543</div>
                <div class="line"><strong>Course:</strong> Enterprise Data Management</div>
                <div class="line"><strong>Submission:</strong> Consultancy Portfolio / Capstone</div>
            </div>

            <div class="footer">Prepared for print submission</div>
        </div>
    </div>
</body>

</html>
